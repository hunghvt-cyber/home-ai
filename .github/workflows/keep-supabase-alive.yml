name: Keep Supabase Alive

on:
  schedule:
    # Chạy vào 03:00 UTC (10:00 sáng giờ VN) mỗi 3 ngày
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}   # cho phép bấm chạy tay để test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase để giữ project active
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://dypqawaqlrthhfxnmxom.supabase.co/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
