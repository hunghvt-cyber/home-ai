name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w '%{http_code}' https://dypqawaqlrthhfxnmxom.supabase.co/rest/v1/rooms?select=id -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
