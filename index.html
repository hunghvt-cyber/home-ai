<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🏠 Home AI</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="container">

<h2>🏠 Home AI</h2>

<input
id="cameraInput"
type="file"
accept="image/*"
capture="environment"
style="display:none;">

<input
id="galleryInput"
type="file"
accept="image/*"
style="display:none;">

<div class="buttonRow">

<button onclick="openCamera()">
📷 Chụp ảnh
</button>

<button onclick="openGallery()">
🖼 Album
</button>

</div>

<img
id="preview"
src=""
style="display:none;">

<p id="selectedImage">
Chưa chọn ảnh
</p>

<div id="message"></div>

<input
id="name"
type="text"
placeholder="Tên đồ">

<input
id="location"
type="text"
placeholder="Vị trí">

<button
id="saveButton"
onclick="saveItem()">
💾 Lưu
</button>

<input
id="search"
type="text"
placeholder="🔍 Tìm kiếm">

<h3>📦 Danh sách đồ</h3>

<div id="list"></div>

</div>

<script src="js/config.js"></script>
<script src="js/image.js"></script>

<script src="js/database/message.js"></script>
<script src="js/database/render.js"></script>
<script src="js/database/load.js"></script>
<script src="js/database/save.js"></script>

<script src="js/search/filter.js"></script>
<script src="js/search/search.js"></script>

<script src="js/ai/vision.js"></script>
<script src="js/ai/chat.js"></script>
<script src="js/ai/suggest.js"></script>

<script src="js/app.js"></script>

</body>

</html>
