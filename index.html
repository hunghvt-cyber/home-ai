<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>🏠 Home AI</title>

<link
rel="stylesheet"
href="css/style.css">

<!-- CDN Thư viện bên thứ 3 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/viewerjs/dist/viewer.min.css">
  
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>

<!-- Firebase + Firestore + ImageKit adapter -->
<script src="js/firebase.js"></script>

<!-- App configuration -->
<script src="https://cdn.jsdelivr.net/npm/compressorjs@1/dist/compressor.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/viewerjs/dist/viewer.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1/Sortable.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode/html5-qrcode.min.js"></script>

</head>

<body>

<div class="container">

<h2>🏠 Home AI</h2>

<button onclick="openRoomManager()">
🏠 Quản lý phòng
</button>

<div id="roomManager" style="display:none;">

<h3>🏠 Quản lý phòng</h3>

<div class="buttonRow">

<input
id="newRoom"
type="text"
placeholder="Tên phòng">

<button onclick="addRoom()">
➕
</button>

<button onclick="closeRoomManager()">
✖
</button>

</div>

<div id="roomList"></div>

</div>

<hr>

<h3>📊 Thống kê phòng</h3>

<div id="roomStats"></div>

<hr>

<input
id="cameraInput"
type="file"
accept="image/*"
capture="environment"
style="display:none;">

<input
id="galleryInput"
type="file"
accept="image/*"
style="display:none;">

<input
id="multiScanInput"
type="file"
accept="image/*"
capture="environment"
style="display:none;">

<input
id="burstCaptureInput"
type="file"
accept="image/*"
multiple
style="display:none;">

<input
id="extraImageInput"
type="file"
accept="image/*"
multiple
style="display:none;">

<div class="batchLocationBox">

<label><b>📍 Vị trí cất chung (Multi/Burst Mode):</b></label>

<div class="buttonRow">

<select id="batchRoomSelect">

<option value="">
-- Chọn phòng mặc định --
</option>

</select>

<input
id="batchLocationInput"
type="text"
placeholder="Vị trí (ví dụ: Hộc tủ 2, Kệ sách)">

</div>

</div>

<div class="buttonRow">

<button onclick="openCamera()">
📷 Chụp 1 món
</button>

<button onclick="openGallery()">
🖼️ Album
</button>

<button onclick="openMultiScanCamera()" class="btnHighlight">
📸 Multi-Scan
</button>

<button onclick="openBurstCapture()" class="btnHighlight">
⚡ Burst Mode
</button>

</div>

<div id="burstStatusBox" class="burstStatusBox" style="display:none;">

<span id="burstStatusText">⚡ Đang xử lý...</span>

<div class="progressBar">
<div id="burstProgressBar" class="progressFill"></div>
</div>

</div>

<div class="buttonRow" style="margin-top:8px;">

<button onclick="analyzeImage()">
🤖 AI Phân tích (1 món)
</button>

</div>

<img
id="preview"
src=""
style="display:none;">

<div
id="existingExtraStrip"
class="extraStrip">
</div>

<div
id="pendingExtraStrip"
class="extraStrip">
</div>

<p id="selectedImage">
Chưa chọn ảnh
</p>

<div id="message"></div>

<input
id="name"
type="text"
placeholder="Tên đồ">

<input
id="location"
type="text"
placeholder="Vị trí">

<input
id="tags"
type="text"
placeholder="🏷 Tag (ví dụ: gia dụng, AQUA)">

<textarea
id="description"
placeholder="📝 Mô tả">
</textarea>

<select id="room">

<option value="">
-- Chọn phòng --
</option>

</select>

<div class="buttonRow">

<button
id="saveButton"
onclick="saveItem()">
💾 Lưu
</button>

<button
id="addCameraButton"
onclick="openExtraCamera()"
style="display:none;">
📷 Chụp thêm
</button>

<button
id="addGalleryButton"
onclick="openExtraGallery()"
style="display:none;">
🖼️ Thêm từ album
</button>

<button
id="skipButton"
onclick="skipItem()"
style="display:none;">
⏭️ Bỏ qua
</button>

<button
id="cancelButton"
onclick="cancelEdit()"
style="display:none;">
❌ Hủy
</button>

</div>

<div class="buttonRow" style="align-items: center; gap: 6px;">

<input
id="search"
type="text"
placeholder="🔍 Tìm kiếm..."
style="flex:1;">

<button onclick="startQRScanner()" style="min-height:48px; background:#455a64; color:#fff;">
📷 Quét QR
</button>

</div>

<select id="roomFilter">

<option value="">
🏠 Tất cả phòng
</option>

</select>

<button
id="emptyTrashButton"
onclick="emptyTrash()"
style="display:none;">
🧹 Làm sạch thùng rác
</button>

<h3>📦 Danh sách đồ</h3>

<div id="list"></div>

</div>

<!-- Modal Duyệt Batch -->
<div id="batchModal" class="modalOverlay" style="display:none;">

<div class="modalContent">

<h3>📋 Duyệt danh sách nhận diện</h3>

<p class="modalSubtext">Kéo thả hoặc bỏ chọn những món không muốn lưu trước khi bấm Lưu.</p>

<div id="batchItemsList" class="batchList"></div>

<div class="buttonRow modalFooter">

<button onclick="saveBatchItems()" class="btnSuccess">
💾 Lưu toàn bộ đã chọn
</button>

<button onclick="closeBatchModal()" class="btnSecondary">
✖ Hủy
</button>

</div>

</div>

</div>

<!-- Modal Quét Mã QR / Barcode -->
<div id="qrModal" class="modalOverlay" style="display:none;">

<div class="modalContent" style="max-width:400px; text-align:center;">

<h3>📷 Quét Mã QR / Mã Vạch</h3>

<div id="qrReader" style="width:100%; min-height:250px; background:#000; border-radius:8px; overflow:hidden;"></div>

<button onclick="stopQRScanner()" class="btnSecondary" style="margin-top:12px; width:100%;">
❌ Đóng Camera
</button>

</div>

</div>
<script src="js/config.js"></script>
<script src="js/database/message.js"></script>
<script src="js/database/save-utils.js"></script>
<script src="js/database/render.js"></script>
<script src="js/database/load.js"></script>
<script src="js/database/image-gallery.js"></script>
<script src="js/database/form.js"></script>

<script src="js/database/delete.js"></script>
<script src="js/database/trash.js"></script>
<script src="js/database/edit.js"></script>

<script src="js/database/save-upload.js"></script>
<script src="js/database/save-extra.js"></script>
<script src="js/database/save-item.js"></script>
<script src="js/database/save.js"></script>

<script src="js/rooms/rooms.js"></script>
<script src="js/rooms/stats.js"></script>

<script src="js/search/filter.js"></script>
<script src="js/search/search.js"></script>

<script src="js/image.js"></script>

<script src="js/ai/gemini-client.js"></script>
<script src="js/ai/vision.js"></script>
<script src="js/ai/chat.js"></script>
<script src="js/ai/suggest.js"></script>
<script src="js/ai/multi-scan.js"></script>
<script src="js/ai/burst-capture.js"></script>

<script src="js/app.js"></script>

</body>

</html>
